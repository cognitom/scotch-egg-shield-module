CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y

# BLE のプロファイルを4つに絞る。windmill は接続先 (USB と無線4つ) ごとに OS と配列を
# 覚えるので、それより多いと、はみ出したプロファイルが USB の設定を共有してしまう
# (include/windmill/host_config.h)
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4

CONFIG_ZMK_SLEEP=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_ZMK_BATTERY=n

