manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      # .github/workflows/build.yml の build-user-config.yml@ と揃える
      revision: v0.3.0
      import: app/west.yml
      # import 越しには ZMK の west-commands が載らないので、`west test` (scripts/test.sh
      # が使う) のために名指しする
      west-commands: app/scripts/west-commands.yml
  self:
    path: config
